name: Sync Watched Films

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install letterboxdpy==6.5.7

      - name: Sync watched lists
        run: python scripts/sync_watched.py

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add src/data/watched_slugs.json
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Automated watched list sync"
            git pull --rebase
            git push
          fi
