name: Build TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-tv/**'
      - '.github/workflows/build_tv_apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android-tv
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: letterboxd-tv-apk
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as direct download
        run: cp android-tv/app/build/outputs/apk/debug/app-debug.apk letterboxd-tv.apk

      - name: Update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-apk
          name: TV APK
          body: "APK para a TV box. Link direto: https://github.com/${{ github.repository }}/releases/download/tv-apk/letterboxd-tv.apk"
          files: letterboxd-tv.apk
          make_latest: true
